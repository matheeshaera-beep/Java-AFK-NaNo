org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# dl.google.com / plugins.gradle.org are unreachable here; keep the fallback
# repositories from stalling the build for minutes on every miss.
systemProp.org.gradle.internal.http.connectionTimeout=8000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.repository.max.retries=1
android.useAndroidX=true
kotlin.code.style=official